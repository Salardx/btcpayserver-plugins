name: Build and test

# BTCPay Server starts inside the runner against a PostgreSQL service container; the chains are fake nodes.
# The pack job then builds the .btcpay package of every plugin and keeps it as an artifact.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      demo:
        description: Testnet demo to record
        type: choice
        options:
          - near
          - solana
          - arc
          - avalanche
          - flare
          - bnb
          - iotex
        default: near
  schedule:
    # Mondays 05:23 UTC: the latest-btcpay job below, against BTCPay Server's newest release.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: neo_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEO_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=neo_tests;Username=postgres
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build tests/BTCPayServer.Plugins.Tests -m:1 -p:StaticWebAssetsEnabled=false
      - name: Format check
        run: |
          dotnet format src/BTCPayServer.Plugins.Chains --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.Neo --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.BNBChain --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.NEAR --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.Solana --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.Arc --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.Avalanche --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.Flare --verify-no-changes --no-restore
          dotnet format src/BTCPayServer.Plugins.IoTeX --verify-no-changes --no-restore
          dotnet format tests/BTCPayServer.Plugins.Tests --verify-no-changes --no-restore
          dotnet format demo/DemoHost --verify-no-changes --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pay page bundle matches its source
        working-directory: src/BTCPayServer.Plugins.NEAR/paypage
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../Resources/nearpay/app.js
      - name: Test (unit and host)
        run: dotnet test tests/BTCPayServer.Plugins.Tests -m:1 -p:StaticWebAssetsEnabled=false --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/BTCPayServer.Plugins.Tests/TestResults/*.trx

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    strategy:
      matrix:
        plugin:
          - BTCPayServer.Plugins.Neo
          - BTCPayServer.Plugins.BNBChain
          - BTCPayServer.Plugins.NEAR
          - BTCPayServer.Plugins.Solana
          - BTCPayServer.Plugins.Arc
          - BTCPayServer.Plugins.Avalanche
          - BTCPayServer.Plugins.Flare
          - BTCPayServer.Plugins.IoTeX
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: bash pack.sh ${{ matrix.plugin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: artifacts/packed/${{ matrix.plugin }}/*

  # Every week (and on demand): the same build and tests against BTCPay Server's latest release instead of the pinned
  # submodule, so an upstream change that breaks a plugin shows up here before a merchant notices.
  latest-btcpay:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: neo_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEO_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=neo_tests;Username=postgres
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Move BTCPay Server to its latest release
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/btcpayserver/btcpayserver 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Testing against BTCPay Server $latest"
          echo "Tested against BTCPay Server $latest" >> "$GITHUB_STEP_SUMMARY"
          git -C submodules/btcpayserver fetch --depth 1 origin "refs/tags/$latest:refs/tags/$latest"
          git -C submodules/btcpayserver checkout --quiet "$latest"
      - name: Build
        run: dotnet build tests/BTCPayServer.Plugins.Tests -m:1 -p:StaticWebAssetsEnabled=false
      - name: Test (unit and host)
        run: dotnet test tests/BTCPayServer.Plugins.Tests -m:1 -p:StaticWebAssetsEnabled=false --no-build

  # The demo: BTCPay Server with the NEAR plugin on the NEAR testnet, an invoice paid from a throwaway testnet account,
  # recorded in a browser. On demand only; the accounts come from repository secrets (NEAR_DEMO_PAYER_ID,
  # NEAR_DEMO_PAYER_KEY, NEAR_DEMO_SHOP, optionally NEAR_DEMO_USDC with the testnet USDC contract when the payer holds test USDC).
  # The input picks another plugin and testnet instead:
  #   solana                       Solana devnet, paid by the Solana Pay reference implementation: SOLANA_DEMO_PAYER_KEY, SOLANA_DEMO_SHOP
  #   arc, avalanche, flare, bnb,  Arc testnet, Avalanche Fuji, Flare Coston2, BNB Smart Chain testnet, IoTeX testnet:
  #   iotex                        EVM_DEMO_PAYER_KEY, EVM_DEMO_SHOP
  # Each records an invoice in the chain's coin and, when the payer holds the test token, a second one in that token
  # (IoTeX has no test token: its recording is the IOTX invoice alone).
  demo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DEMO_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the host
        run: dotnet build demo/DemoHost -m:1 -p:StaticWebAssetsEnabled=false
      - name: Install the recorder
        working-directory: demo
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start BTCPay Server with the plugins
        env:
          # The BNB Smart Chain testnet has no canonical USDT; this is the test token the recorder pays with.
          BSC_USDT_CONTRACT: ${{ inputs.demo == 'bnb' && '0x337610d27c682E347C9cD60BD4b3b107C9d34dDd' || '' }}
        run: |
          nohup dotnet run --project demo/DemoHost --no-build > demo-host.log 2>&1 &
          for i in $(seq 1 60); do
            if [ -f demo-host.json ]; then echo "up after $i tries"; break; fi
            sleep 5
          done
          if [ ! -f demo-host.json ]; then echo "BTCPay Server did not start"; tail -50 demo-host.log; exit 1; fi
      - name: Pay an invoice on testnet and record it
        working-directory: demo
        env:
          DEMO_HOST_FILE: ../demo-host.json
          NEAR_SHOP: ${{ secrets.NEAR_DEMO_SHOP }}
          NEAR_PAYER_ID: ${{ secrets.NEAR_DEMO_PAYER_ID }}
          NEAR_PAYER_KEY: ${{ secrets.NEAR_DEMO_PAYER_KEY }}
          NEAR_USDC: ${{ secrets.NEAR_DEMO_USDC }}
          EVM_PRESET: ${{ inputs.demo }}
          EVM_SHOP: ${{ secrets.EVM_DEMO_SHOP }}
          EVM_PAYER_KEY: ${{ secrets.EVM_DEMO_PAYER_KEY }}
          SOLANA_SHOP: ${{ secrets.SOLANA_DEMO_SHOP }}
          SOLANA_PAYER_KEY: ${{ secrets.SOLANA_DEMO_PAYER_KEY }}
        run: node ${{ inputs.demo == 'near' && 'record.mjs' || inputs.demo == 'solana' && 'record-solana.mjs' || 'record-evm.mjs' }}
      - name: Convert the video
        if: always()
        working-directory: demo
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          for f in out/*/demo.webm; do
            if [ -f "$f" ]; then ffmpeg -loglevel error -y -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "${f%.webm}.mp4"; fi
          done
          ls -la out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.demo }}-demo
          path: |
            demo/out/
            demo-host.log
